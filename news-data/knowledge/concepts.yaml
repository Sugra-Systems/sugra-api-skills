# Concept registry of the knowledge files, every area of the four domain skills: one item per concept.
# Fields: id, name, unit, freq; lag, sa and note only where useful.
# Money levels carry the US unit; other countries report in national currency.

# labour
- id: labour.unemployment_rate
  name: "Unemployment rate"
  unit: pct
  freq: monthly
  lag: "about 1 week after the month (US, Canada) to 6 weeks"
  sa: "SA"
- id: labour.payrolls
  name: "Payroll employment, establishment survey"
  unit: thousands
  freq: monthly
  lag: "about 1 week after the month (US)"
  sa: "SA"
  note: "revised in the next two releases and once a year"
- id: labour.participation_rate
  name: "Labour force participation rate"
  unit: pct
  freq: monthly
  lag: "with the unemployment rate"
- id: labour.participation_prime_age
  name: "Participation rate, ages 25-54"
  unit: pct
  freq: monthly
  lag: "with the unemployment rate"
- id: labour.employment_population_prime_age
  name: "Employment-population ratio, ages 25-54"
  unit: pct
  freq: monthly
  lag: "with the unemployment rate"
- id: labour.underemployment_rate
  name: "Broad unemployment rate, with involuntary part-time and marginally attached"
  unit: pct
  freq: monthly
  lag: "with the unemployment rate"
- id: labour.unemployed_level
  name: "Number of unemployed persons"
  unit: thousands
  freq: monthly
- id: labour.unemployed_job_losers
  name: "Unemployed job losers, including temporary layoffs"
  unit: thousands
  freq: monthly
- id: labour.unemployed_entrants
  name: "Unemployed new entrants and re-entrants"
  unit: thousands
  freq: monthly
- id: labour.average_pay
  name: "Average pay, hourly (US payroll survey) or weekly (UK)"
  unit: usd
  freq: monthly
  lag: "with payrolls (US)"
  note: "read as change from a year ago; the UK figure is in pounds a week"
- id: labour.wage_growth_regular
  name: "Regular pay growth, excluding bonuses (UK)"
  unit: pct
  freq: monthly
  lag: "about 6 weeks; a 3-month average"
  note: "total pay includes bonuses and is not regular pay"
- id: labour.payrolls_first_print
  name: "First published payroll change and its later revisions"
  unit: thousands
  freq: monthly
  note: "needs vintage history of the release"
- id: labour.employment_cost_index
  name: "Employment cost index, wages and benefits"
  unit: index
  freq: quarterly
  lag: "about 1 month after the quarter"
  note: "fixed job mix"
- id: labour.wage_growth_tracker
  name: "Median wage growth of the same individuals (Atlanta Fed tracker)"
  unit: pct
  freq: monthly
  note: "headline is a 3-month moving average"
- id: labour.initial_claims
  name: "Initial jobless claims"
  unit: count
  freq: weekly
  lag: "the Thursday after the week (US)"
  sa: "SA and NSA"
- id: labour.continuing_claims
  name: "Continuing claims, insured unemployment"
  unit: count
  freq: weekly
  lag: "one week behind initial claims"
- id: labour.job_openings
  name: "Job openings"
  unit: thousands
  freq: monthly
  lag: "about 5 weeks after the month"
  note: "a stock on the last business day of the month"
- id: labour.quits_rate
  name: "Quits rate"
  unit: pct
  freq: monthly
  lag: "with job openings"
  note: "a flow over the month"
- id: labour.conditions_index
  name: "Labour market conditions index, level and momentum (Kansas City Fed)"
  unit: index
  freq: monthly
- id: labour.sahm_rule
  name: "Sahm rule recession indicator"
  unit: pp
  freq: monthly
  lag: "with the unemployment rate"
  note: "first-release and revised versions differ"

