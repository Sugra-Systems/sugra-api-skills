  freq: monthly
  lag: "about 4 weeks after the month (US)"
- id: growth.durable_goods_orders
  name: "Durable goods orders"
  unit: usd_mn
  freq: monthly
  lag: "about 4 weeks after the month (US)"
- id: growth.inventories_to_sales
