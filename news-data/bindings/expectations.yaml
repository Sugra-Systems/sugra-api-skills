# Expectations bindings: concept id -> country -> call spec, gap or compute. Read mechanics.md first.
expectations.release_consensus:
  us: {gap: "no analyst consensus for US releases in the catalog", substitute: "the series' own trend over 3 and 6 months, labelled against trend; market pricing: rates.futures_path"}
  ez: {gap: "no analyst consensus for euro area releases in the catalog", substitute: "the series' own trend, labelled against trend"}
  gb: {gap: "no analyst consensus for UK releases in the catalog", substitute: "the series' own trend, labelled against trend"}
  jp: {gap: "no analyst consensus for Japan releases in the catalog", substitute: "the series' own trend, labelled against trend"}
  cn: {gap: "no analyst consensus for China releases in the catalog", substitute: "the series' own trend, labelled against trend"}
  ca: {gap: "no release consensus for Canada in the catalog", substitute: "firm and household surveys: boc_business_outlook_survey, boc_consumer_survey"}
  de: {gap: "no analyst consensus for Germany releases in the catalog", substitute: "the series' own trend, labelled against trend"}
  br: {op: bcb_expectations, unit: pct, note: "survey median by indicator and year; monthly horizons: bcb_expectations_monthly"}
  ar: {op: central_banks_bcra_inflation, unit: pct, note: "survey median of inflation 12 months ahead, series 29"}
expectations.professional_survey:
  us: {gap: "the survey of professional forecasters is not in the catalog", substitute: "expectations.inflation_model and expectations.cb_projections, each named"}
  br: {op: bcb_expectations, unit: pct, note: "survey median by indicator and year"}
expectations.inflation_household:
  us: {op: macro_country_section, key: us/umich-inflation-1y, transforms: [mom_pp, yoy_pp], unit: pct}
  ca: {op: boc_consumer_survey, unit: pct, note: "quarterly household survey"}
expectations.inflation_market_5y:
  us: {op: macro_country_section, key: us/breakeven5y, transforms: [dod_bps, wow_bps], unit: pct, note: "10-year: us/breakeven10y"}
  gb: {op: boe_yields, unit: pct, note: "implied inflation forward rate at 5 years, not a 5-year average"}
expectations.inflation_model:
  us: {op: macro_country_section, key: us/expinf1yr, transforms: [mom_pp, yoy_pp], unit: pct, note: "1 year ahead; 5 years: us/expinf5yr"}
expectations.cb_projections:
  us: {op: macro_country_section, key: us/fedtarmd, unit: pct, note: "median policy rate projection by year"}
expectations.data_vintages:
  us:
    op: imf_revisions_dataflow_country_indicator
    params: {dataflow: weo, country: USA, indicator: NGDP_RPCH, vintage: WEO_2025_OCT_VINTAGE}
    unit: pct
    note: "latest against the October 2025 edition, the only earlier one kept (no April editions exist; a missing label is a gap, do not try others); for monthly US data only the Sahm pair in labour.sahm_rule has a first-release and a revised version"
  other:
    op: imf_revisions_dataflow_country_indicator
    params: {dataflow: weo, country: "<ISO3>", indicator: NGDP_RPCH, vintage: WEO_2025_OCT_VINTAGE}
    unit: pct
